{% extends 'layouts/app.html' if current_user else 'layouts/base.html' %}
{% block title %}{{ title }} | SIT-EnrollEase{% endblock %}

{% block content %}
<div class="container py-5 text-center" style="max-width: 560px">
  <i class="bi {{ icon }} display-3 text-success"></i>
  <div class="text-muted small mt-2">Error {{ code }}</div>
  <h1 class="h3 mb-2">{{ title }}</h1>
  <p class="text-muted mb-4">{{ text }}</p>
  <div class="d-flex flex-wrap justify-content-center gap-2">
    <button type="button" class="btn btn-outline-sit" onclick="history.back()"><i class="bi bi-arrow-left"></i> Go back</button>
    {% if current_user %}
    <a href="{{ url_for('dashboard.home') }}" class="btn btn-sit">Go to Dashboard</a>
    {% else %}
    <a href="/" class="btn btn-sit">Back to Home</a>
    {% endif %}
  </div>
</div>
{% endblock %}
