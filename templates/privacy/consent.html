{% extends 'layouts/app.html' %}
{% block title %}Data Privacy Notice | SIT-EnrollEase{% endblock %}

{% block content %}
<div style="max-width: 800px">
  <h1 class="h2 mb-1">Before you continue</h1>
  <p class="text-muted mb-3">Please read the Data Privacy Notice and accept it to use SIT-EnrollEase.</p>

  <div class="card mb-3"><div class="card-body p-4" style="max-height: 420px; overflow-y: auto">{% include 'privacy/_policy.html' %}</div></div>

  <form method="post" class="needs-validation" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
      <label class="form-check-label" for="agree">I have read the Data Privacy Notice and I agree to the collection and use of my information as described.</label>
      <div class="invalid-feedback">You must agree to continue.</div>
    </div>
    <button type="submit" class="btn btn-sit">I agree and continue</button>
  </form>

  <form method="post" action="{{ url_for('auth.logout') }}" class="mt-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn btn-link p-0 text-muted">I do not agree. Log me out.</button>
  </form>
</div>
{% endblock %}
